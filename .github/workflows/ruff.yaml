name: Ruff

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run -m ruff check --output-format=github
      - name: Ruff format --check
        run: uv run -m ruff format --check --output-format=github
